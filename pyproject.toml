[project]
authors = [
  {name = "BretRen", email = "bretren2013@gmail.com"},
]
dependencies = [
  "flet[all]>=1.0.4",
  "minecraft-launcher-lib>=8.0",
]
description = "A simple Minecraft Laucher"
name = "pidanlauncher"
readme = "README.md"
requires-python = ">=3.11"
version = "0.1.0"

[project.scripts]
pidanlauncher = "pidanlauncher:main"

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.12.5,<0.13.0"]

[tool.flet]
company = "Pdnode"
copyright = "Copyright (C) 2026 by Pidan"
org = "com.pdnode"
product = "PidanLauncher"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
